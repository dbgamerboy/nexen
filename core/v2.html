<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXEN V2</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,system-ui,sans-serif;background:#101319;color:#eef1f5}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:44px 26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:15px;letter-spacing:.24em;font-weight:800;color:#f8877f}h1{font-size:clamp(38px,7vw,70px);letter-spacing:-.05em;line-height:1;margin:28px 0 18px}p{color:#afb9c6;line-height:1.6;max-width:760px}.status{border:1px solid #465568;border-radius:99px;padding:10px 16px;color:#e8cc8a;font-size:13px}.status.ready{color:#8cdfaf;border-color:#386249}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:28px 0}article{border:1px solid #343d49;border-radius:16px;padding:23px;background:#191e27}article h2{font-size:18px;margin:15px 0 9px}article p{font-size:14px;margin:0}.flag{font-size:11px;letter-spacing:.1em;font-weight:800;color:#e8cc8a}.flag.ready{color:#8cdfaf}nav{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}a{color:#edf3fa;text-decoration:none;padding:12px 17px;border:1px solid #455267;border-radius:9px;background:#222c3a}a:hover,a:focus-visible{background:#35455a}.small{font-size:12px}footer{border-top:1px solid #303b4b;margin-top:38px;padding-top:20px}#error{color:#fca5a5}@media(max-width:650px){.grid{grid-template-columns:1fr}main{padding:28px 18px}header{align-items:flex-start}}
</style></head><body><main><header><div class="brand">NEXEN V2</div><div id="status" class="status" role="status">Checking services</div></header>
<h1>Your system.<br>One place to run it.</h1><p>Startup, MARVIN and background work in one place. Each status comes from the running system.</p><p id="error" role="alert"></p><section class="grid" id="checks" aria-label="V2 service checks"></section>
<nav aria-label="Workspaces"><a href="/">Control center</a><a href="/game">WDR City</a><a href="/tasks">My tasks</a><a href="/automatic-mode">Automations</a><a href="/intake-desk">Photos &amp; workflows</a><a href="/connections">Connections</a></nav>
<footer><p id="scope"></p><p id="census" class="small"></p><p id="time" class="small"></p></footer></main>
<script>
let busy=false;async function refresh(){if(busy||document.hidden)return;busy=true;const c=new AbortController(),timer=setTimeout(()=>c.abort(),7000);try{const r=await fetch('/api/v2/status',{signal:c.signal});if(r.status===401){location.replace('/login?next=/v2');return}if(!r.ok)throw Error('Service check unavailable. Retrying automatically.');const d=await r.json();document.getElementById('error').textContent='';const s=document.getElementById('status');s.textContent=d.status==='operational'?'V2 operational':'V2 · setup in progress';s.classList.toggle('ready',d.status==='operational');const rows=document.getElementById('checks');rows.replaceChildren();for(const x of d.checks){const a=document.createElement('article'),f=document.createElement('span'),h=document.createElement('h2'),p=document.createElement('p');f.className='flag'+(x.ready?' ready':'');f.textContent=x.ready?'VERIFIED':'NEEDS ATTENTION';h.textContent=x.label;p.textContent=x.detail;a.append(f,h,p);rows.append(a)}document.getElementById('scope').textContent=d.scope;document.getElementById('census').textContent=d.census.files_counted==null?'Inventory count unavailable.':Number(d.census.files_counted).toLocaleString()+' files inventoried. '+d.census.detail;document.getElementById('time').textContent='Checked '+new Date(d.checked_at).toLocaleString()}catch(e){document.getElementById('error').textContent=e.name==='AbortError'?'Check timed out. Retrying automatically.':e.message;document.getElementById('status').textContent='V2 · live check unavailable';document.getElementById('status').classList.remove('ready');for(const f of document.querySelectorAll('#checks .flag')){f.textContent='STALE';f.classList.remove('ready')}}finally{clearTimeout(timer);busy=false}}refresh();setInterval(refresh,15000);document.addEventListener('visibilitychange',refresh);
</script></body></html>
